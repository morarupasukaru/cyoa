<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Play Your Own Adventure</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body th:object="${adventure}" class="page-shell">
    <header>
        <p class="eyebrow">Your adventure begins here</p>
        <h1 th:text="*{description}">Default Welcome Message</h1>
    </header>

    <main>
        <a th:href="@{/locations/{id}(id=${startLocationId})}">Play</a>
        <a class="secondary-link" th:href="@{/adventures/basic}">Download C64 BASIC game</a>
    </main>
</body>
</html>
