<html xmlns:th="http://www.thymeleaf.org" th:object="${adventure}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="*{description}"></title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body th:object="${location}" class="page-shell">
    <header>
        <p class="eyebrow">Choose your next step</p>
        <h1 th:text="*{text}"></h1>
    </header>

    <main>
        <div class="options" th:if="*{not #lists.isEmpty(options)}">
            <a th:each="option : *{options}" th:href="@{/locations/{id}(id=${option.locationId})}" th:text="${option.text}"></a>
        </div>
        <a class="secondary-link" th:href="@{/reset}" th:if="*{#lists.isEmpty(options)}">Start another adventure</a>
    </main>
</body>
</html>
